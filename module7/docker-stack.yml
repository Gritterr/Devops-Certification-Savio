# Objective 6: deploy the website on the swarm and expose port 80.
# Deploy with:
#   IMAGE=<dockerhub-user>/company-website:1.0 docker stack deploy -c docker-stack.yml company
# Without IMAGE it uses the locally built company-website:1.0 (works on a single-node swarm).
version: "3.8"

services:
  website:
    # Objective 4: the image pushed to Docker Hub, so every node can pull it
    image: ${IMAGE:-company-website:1.0}
    ports:
      # Swarm's routing mesh publishes port 80 on every node in the cluster
      - "80:80"
    volumes:
      # Every replica mounts the same named volume, so they all serve the same files
      - website-data:/usr/local/apache2/htdocs
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

volumes:
  # A named volume lives outside the containers and survives them being replaced.
  # On a single-node swarm all replicas share it directly.
  #
  # On a multi-node swarm each node would get its own local copy. To give every
  # node the same source, back the volume with a shared NFS export by
  # uncommenting the lines below it.
  website-data:
    # driver: local
    # driver_opts:
    #   type: nfs
    #   o: "addr=<nfs-server-ip>,rw"
    #   device: ":/exports/company-website"
